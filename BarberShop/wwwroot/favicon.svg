<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente Dourado Nobre -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A3" />
      <stop offset="25%" stop-color="#E2BE72" />
      <stop offset="50%" stop-color="#C8A96B" />
      <stop offset="75%" stop-color="#DFBA6E" />
      <stop offset="100%" stop-color="#9A7530" />
    </linearGradient>
    <linearGradient id="poleStripe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="100%" stop-color="#C8A96B" />
    </linearGradient>
    <!-- Sombra para contraste extremo em abas claras ou escuras -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Coroa Real Superior -->
    <path d="M 22 14 L 27 7 L 32 12 L 37 7 L 42 14 L 39 16 L 25 16 Z" 
          fill="url(#goldGrad)" stroke="#FFE8A3" stroke-width="0.5" />
    <circle cx="27" cy="6" r="1.2" fill="#FFF2B2" />
    <circle cx="32" cy="11" r="1.2" fill="#FFF2B2" />
    <circle cx="37" cy="6" r="1.2" fill="#FFF2B2" />

    <!-- Barber Pole Lateral Esquerdo -->
    <!-- Esferas e Acabamentos do Poste -->
    <circle cx="16" cy="18" r="3.2" fill="url(#goldGrad)" stroke="#FFF2B2" stroke-width="0.4" />
    <rect x="13.5" y="21" width="5" height="2" rx="0.8" fill="url(#goldGrad)" />
    
    <!-- Cilindro do Poste -->
    <rect x="14" y="23" width="4" height="28" rx="0.5" fill="#111111" />
    <clipPath id="poleClip">
      <rect x="14" y="23" width="4" height="28" rx="0.5" />
    </clipPath>
    <!-- Listras Diagonais Douradas -->
    <g clip-path="url(#poleClip)">
      <path d="M 12 25 L 20 20 L 20 24 L 12 29 Z" fill="url(#poleStripe)" />
      <path d="M 12 32 L 20 27 L 20 31 L 12 36 Z" fill="url(#poleStripe)" />
      <path d="M 12 39 L 20 34 L 20 38 L 12 43 Z" fill="url(#poleStripe)" />
      <path d="M 12 46 L 20 41 L 20 45 L 12 50 Z" fill="url(#poleStripe)" />
    </g>
    <!-- Base do Poste -->
    <rect x="13.5" y="51" width="5" height="2" rx="0.8" fill="url(#goldGrad)" />
    <circle cx="16" cy="54" r="3.2" fill="url(#goldGrad)" stroke="#FFF2B2" stroke-width="0.4" />

    <!-- Letra B Imperial Majestosa -->
    <path d="M 23 18 
             L 37 18 
             C 45 18 49 22 49 28 
             C 49 32.5 45.5 35.5 41 36.5 
             C 47.5 38 52 42.5 52 49 
             C 52 57 44 60 35 60 
             L 23 60 
             Z
             M 30 24 
             L 30 34 
             L 36 34 
             C 40 34 43 32 43 29 
             C 43 26 40 24 36 24 
             Z
             M 30 40 
             L 30 54 
             L 36 54 
             C 42 54 45 52 45 47 
             C 45 42 41 40 36 40 
             Z" 
          fill="url(#goldGrad)" 
          stroke="#FFE8A3" 
          stroke-width="0.6"
          fill-rule="evenodd" />

    <!-- Detalhe da Folha / Arabesco Inferior da Letra B -->
    <path d="M 33 46 C 36 53 43 56 41 62 C 34 60 30 52 33 46 Z" fill="#FFE8A3" opacity="0.9" />
  </g>
</svg>
